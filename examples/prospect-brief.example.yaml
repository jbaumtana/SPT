# Fictional prospect, for testing the pipeline end to end.
company:
  name: Bayline Health
  website: https://example.com/bayline
  size: Regional system, 9 hospitals, 40 clinics
  social_handles:
    instagram: "@baylinehealth"
    facebook: Bayline Health
    linkedin: bayline-health
industry: healthcare
industry_detail: Regional nonprofit hospital system
use_cases: [publishing, approvals, engagement-inbox, reporting]
competitors: [Coastal Regional Medical, Harborpoint Health]
incumbent_tools: [native network tools, shared spreadsheet calendar]
pains:
